<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Assistant</title>
  <meta name="description" content="Protótipo de assistente conversacional em HTML, CSS e JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- Cabeçalho -->
    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor">
            <path d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2zm0 26a12 12 0 1 1 12-12 12 12 0 0 1-12 12z"/>
            <path d="M15 8h2v10h-2zM15 20h2v2.5h-2z"/>
          </svg>
        </span>
        <div class="app-header__text">
          <h1 class="app-header__title">AI Assistant</h1>
          <p class="app-header__subtitle">Protótipo de chat · respostas simuladas</p>
        </div>
      </div>

      <button id="new-chat-btn" class="btn btn--ghost" type="button" title="Iniciar nova conversa">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
          <path d="M16 4a12 12 0 1 0 9.9 5.2l-1.8 1.2A9.8 9.8 0 1 1 16 6.2V10l6-4-6-4z"/>
        </svg>
        <span class="btn__label">Nova conversa</span>
      </button>
    </header>

    <!-- Área de mensagens -->
    <main id="messages" class="messages" role="log" aria-live="polite" aria-label="Histórico da conversa"></main>

    <!-- Composer -->
    <footer class="composer">
      <form id="composer-form" class="composer__form" autocomplete="off">
        <label class="sr-only" for="message-input">Digite sua mensagem</label>
        <textarea
          id="message-input"
          class="composer__input"
          rows="1"
          placeholder="Digite sua mensagem..."
          aria-describedby="composer-hint"
        ></textarea>

        <button id="send-btn" class="btn btn--primary" type="submit" title="Enviar mensagem">
          <span class="btn__label">Enviar</span>
          <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
            <path d="M28.6 3.4 2.8 14.1a1 1 0 0 0 .2 1.9l10.2 2.6 2.6 10.2a1 1 0 0 0 1.9.2L28.6 3.4zM6.8 15.1 24.7 7.3l-7.8 17.9-2.2-8.6 8-8-9.9 6.1z"/>
          </svg>
        </button>
      </form>
      <p id="composer-hint" class="composer__hint">Enter envia · Shift + Enter quebra linha</p>
    </footer>

  </div>

  <script src="assistant.js"></script>
  <script src="app.js"></script>
</body>
</html>
